[project]
name = "zhihu-mcp"
version = "1.0.0"
description = "MCP runtime for the ZhiHu health-practice training agent"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.0.0,<3",
]

[project.optional-dependencies]
postgres-direct = ["psycopg[binary]>=3.2,<4"]
local-reader = ["pypdfium2>=4.30,<6", "Pillow>=10,<13"]

[tool.uv]
package = false
