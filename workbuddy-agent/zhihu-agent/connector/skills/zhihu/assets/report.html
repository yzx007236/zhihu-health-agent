<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知护 · 训练报告</title>
<style>:root{--ink:#18322d;--muted:#667873;--paper:#f5f7f2;--card:#fff;--green:#176b57;--mint:#dff2e9;--amber:#a95f18;--red:#a73535;--line:#dce5df}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}.top{position:sticky;top:0;z-index:3;background:#173d35;color:white;padding:10px 5vw;display:flex;justify-content:space-between;gap:16px}.top strong{letter-spacing:.1em}.notice{background:#fff3d8;color:#62410f;padding:12px 5vw;border-bottom:1px solid #e9cc8b;font-weight:650}.wrap{max-width:1100px;margin:26px auto;padding:0 18px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px #193b3020}.hero{padding:28px;display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.eyebrow{color:var(--green);font-weight:750}.hero h1{font-size:clamp(26px,5vw,48px);line-height:1.1;margin:8px 0}.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score{background:var(--mint);padding:18px;border-radius:14px}.score b{font-size:32px;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{padding:22px}.wide{grid-column:1/-1}h2{font-size:18px;margin:0 0 14px}.row{border-top:1px solid var(--line);padding:12px 0}.row:first-of-type{border-top:0}.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:#edf1ee;color:var(--muted);font-size:12px}.bad{background:#ffe5e3;color:var(--red)}.warn{background:#fff0d8;color:var(--amber)}blockquote{margin:8px 0;padding:10px 14px;border-left:3px solid var(--green);background:#f5faf7}.bar{height:8px;background:#e8eeea;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}a{color:var(--green)}.empty{color:var(--muted)}button{border:0;background:var(--green);color:white;border-radius:10px;padding:10px 15px;font-weight:700}@media(max-width:720px){.hero,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top{font-size:13px}.hero{padding:20px}}</style></head>
<body><header class="top"><strong>知护 ZHIHU</strong><span id="version">训练报告</span></header><div class="notice"><strong id="rule-demo">程序评分结果</strong>｜本反馈仅用于课程学习与能力训练，不构成医疗建议；评分不代表临床能力认定。</div><main class="wrap" id="app"><section class="hero"><div><div class="eyebrow">测—讲—练—诊—再练</div><h1>训练复盘报告</h1><p>载入评分 JSON 后展示证据、知识回连和下一步训练。</p></div><div><input id="file" type="file" accept="application/json"><p class="empty">也可由 generate_report.py 生成已嵌入数据的独立页面。</p></div></section></main>
<script>/*__REPORT_DATA__*/
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(r){const o=r.overview||{},p=r.practice||{},pre=r.pretest,items=p.item_results||[],dims=p.dimension_scores||{},gaps=r.priority_gaps||[],quotes=r.key_quotes||[],links=r.knowledge_links||[],reds=r.red_lines||[],unc=r.uncertain_items||[];document.querySelector('#rule-demo').textContent='程序评分结果';document.querySelector('#version').textContent=`规则 ${o.rubric_version||'—'} · ${o.rubric_status||'—'}`;document.querySelector('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">${esc(o.case_id)} · ${esc(o.case_title)}</div><h1>训练复盘报告</h1><p>会话 ${esc(o.session_id)}｜自测与实践分别展示</p></div><div class="scores"><div class="score"><span>自测分</span><b>${pre?esc(pre.percentage)+'%':'—'}</b></div><div class="score"><span>实践分</span><b>${esc(p.total_score??'—')}</b></div></div></section><div class="grid"><section class="card"><h2>维度表现</h2>${Object.entries(dims).map(([k,v])=>`<div class="row"><b>${esc(k)}</b><span style="float:right">${esc(v.percentage)}%</span><div class="bar"><i style="width:${Number(v.percentage)||0}%"></i></div></div>`).join('')||'<p class="empty">暂无维度数据</p>'}</section><section class="card"><h2>优先改进</h2>${gaps.map(x=>`<div class="row"><span class="pill warn">${esc(x.item_id)}</span><b> ${esc(x.behavior)}</b><p>${esc(x.next_step)}</p></div>`).join('')||'<p class="empty">暂无优先项</p>'}</section><section class="card wide"><h2>评分项与原话证据</h2>${items.map(x=>`<details class="row"><summary><b>${esc(x.item_id)}</b>　${esc(x.score)}/${esc(x.max_score)}　<span class="pill">${esc(x.level)}</span></summary><p>${esc(x.behavior)}</p>${(x.evidence||[]).map(e=>`<blockquote>第 ${esc(e.turn_id)} 轮：${esc(e.quote)}</blockquote>`).join('')||'<p class="empty">无有效原话证据，不计分。</p>'}</details>`).join('')}</section>${reds.length?`<section class="card wide"><h2 style="color:var(--red)">边界违规</h2>${reds.map(x=>`<div class="row"><span class="pill bad">${esc(x.red_line_id)}</span><p>${esc(x.action)}</p></div>`).join('')}</section>`:''}<section class="card"><h2>关键原话</h2>${quotes.map(x=>`<blockquote>第 ${esc(x.turn_id)} 轮：${esc(x.quote)}</blockquote>`).join('')||'<p class="empty">暂无</p>'}</section><section class="card"><h2>知识回连</h2>${links.map(x=>`<div class="row"><b>${esc(x.knowledge_id)} · ${esc(x.title)}</b><p>${esc(x.source)}（${esc(x.review_status)}）</p>${x.source_url?`<a target="_blank" rel="noreferrer" href="${esc(x.source_url)}">核查来源</a>`:''}</div>`).join('')||'<p class="empty">暂无</p>'}</section><section class="card"><h2>待复核项</h2>${unc.map(x=>`<div class="row"><span class="pill warn">${esc(x.reason)}</span></div>`).join('')||'<p class="empty">无</p>'}</section><section class="card"><h2>变式重练</h2>${r.retrain?`<b>${esc(r.retrain.case_id)} · ${esc(r.retrain.title)}</b><p>${esc(r.retrain.task)}</p><button>进入重练</button>`:'<p class="empty">当前病例暂无已配置变式。</p>'}</section></div>`}
document.querySelector('#file').addEventListener('change',async e=>{try{render(JSON.parse(await e.target.files[0].text()))}catch(err){alert('报告 JSON 无法读取：'+err.message)}});if(window.__REPORT__)render(window.__REPORT__);</script></body></html>
